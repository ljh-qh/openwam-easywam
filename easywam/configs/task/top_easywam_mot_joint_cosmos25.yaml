# @package _global_

defaults:
  - override /data: top
  - override /model: easywam_mot_joint_cosmos25_top
  - _self_

batch_size: 2
num_workers: 4

lr_scheduler_type: cosine
learning_rate: 1e-4
# 197 eps / 105748 windows, batch 2 x 8 ranks x accum 8 = 128 -> 5 epochs
max_steps: 4131
log_every: 1
save_every: 1000
eval_every: 0
eval_num_inference_steps: 10

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null

output_dir: /datapool/lianjh/openwam_top/runs/easywam_top
