# @package _global_

defaults:
  - override /data: badminton
  - override /model: easywam_mot_joint_cosmos25_badminton
  - _self_

batch_size: 2
num_workers: 4

lr_scheduler_type: cosine
learning_rate: 1e-4
max_steps: 20
log_every: 1
save_every: 10000
eval_every: 0
eval_num_inference_steps: 10

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null
